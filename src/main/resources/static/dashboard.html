<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Knowledge & Decision Assistant - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-6 md:p-10">

    <div class="max-w-4xl mx-auto space-y-6">

        <!-- Header -->
        <header class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h1 class="text-2xl font-bold text-slate-900">AI Knowledge & Decision Assistant</h1>
            <p class="text-sm text-slate-500 mt-1">SaaS Multi-Tenant Management Dashboard</p>
        </header>

        <!-- 1. Register Organization -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-slate-800 mb-2">1. Register Organization Account</h2>
            <div class="flex gap-3">
                <input type="text" id="orgNameInput" placeholder="Organization Name (e.g. TechCorp University)" class="flex-1 border border-slate-300 rounded-lg px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="handleRegister()" id="btnRegister" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2.5 rounded-lg text-sm transition">Create Account</button>
            </div>
            <div id="orgStatus" class="mt-3 text-sm font-semibold"></div>
        </div>

        <!-- 2. Upload PDF -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-slate-800 mb-1">2. Upload PDF Knowledge Base</h2>
            <p class="text-xs text-slate-400 mb-4">Mandatory limits: Max 10 PDFs, 20 pages/PDF, 10MB/PDF.</p>
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-3 items-end">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Active Org ID</label>
                    <input type="number" id="activeOrgId" placeholder="Auto-filled" readonly class="w-full bg-slate-100 border border-slate-300 rounded-lg px-3 py-2 text-sm font-bold text-slate-700">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Select PDF File</label>
                    <input type="file" id="pdfFileInput" accept=".pdf" class="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-sm file:mr-3 file:py-1 file:px-3 file:rounded file:border-0 file:bg-blue-50 file:text-blue-700 file:font-semibold">
                </div>
                <button onclick="handleUpload()" id="btnUpload" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg transition text-sm">Upload PDF</button>
            </div>
            <div id="uploadStatus" class="mt-3 text-sm font-semibold"></div>
        </div>

        <!-- 3. Assistant URL & Embed Code (Revealed Automatically) -->
        <div id="assistantSection" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 hidden">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-bold text-slate-800">3. Assistant URL & Embed Code</h2>
                <span id="activeOrgBadge" class="bg-green-100 text-green-800 text-xs px-2.5 py-1 rounded-full font-semibold">Ready</span>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Direct Visitor Chat Link (Open in Browser / Tab)</label>
                    <div class="flex gap-2">
                        <input type="text" id="directChatUrl" readonly class="flex-1 bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm text-blue-700 font-mono">
                        <a id="btnOpenChat" href="#" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg text-sm font-medium flex items-center justify-center transition">Open Chat ↗</a>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Embeddable Iframe Code</label>
                    <div class="flex gap-2">
                        <textarea id="embedIframeCode" readonly rows="2" class="flex-1 bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-xs font-mono text-slate-700"></textarea>
                        <button onclick="copyEmbed()" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-lg text-sm font-medium transition self-start">Copy Code</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        let currentOrgId = null;
        let currentAssistantToken = null;

        // 1. REGISTER & AUTO-FETCH TOKEN VIA LOGIN
        async function handleRegister() {
            const orgName = document.getElementById('orgNameInput').value.trim();
            const statusDiv = document.getElementById('orgStatus');
            
            if (!orgName) {
                statusDiv.className = "text-red-600 mt-2 text-sm";
                statusDiv.innerText = "Please enter an organization name.";
                return;
            }

            statusDiv.className = "text-blue-600 mt-2 text-sm";
            statusDiv.innerText = "Creating organization...";

            try {
                // Register via @RequestParam String name
                const params = new URLSearchParams();
                params.append('name', orgName);

                const regRes = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params
                });

                if (!regRes.ok) {
                    const err = await regRes.text();
                    throw new Error(err || "Registration failed");
                }

                const savedOrg = await regRes.json();
                currentOrgId = savedOrg.id;
                document.getElementById('activeOrgId').value = currentOrgId;

                // Auto-login to obtain the generated assistant token!
                const loginRes = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params
                });

                if (loginRes.ok) {
                    const loginText = await loginRes.text();
                    // Extracts token after "Assistant Token: "
                    if (loginText.includes("Assistant Token: ")) {
                        currentAssistantToken = loginText.split("Assistant Token: ")[1].trim();
                    }
                }

                statusDiv.className = "text-green-600 mt-2 text-sm";
                statusDiv.innerText = `✅ Registered Successfully! Org ID: ${currentOrgId} | Name: ${savedOrg.name}`;

                if (currentAssistantToken) {
                    displayAssistantUrls(currentAssistantToken, savedOrg.name);
                }

            } catch (err) {
                statusDiv.className = "text-red-600 mt-2 text-sm";
                statusDiv.innerText = "Error: " + err.message;
            }
        }

        // 2. UPLOAD PDF TO /api/documents/upload
        async function handleUpload() {
            const statusDiv = document.getElementById('uploadStatus');
            const fileInput = document.getElementById('pdfFileInput');
            const file = fileInput.files[0];

            if (!currentOrgId) {
                statusDiv.className = "text-red-600 mt-2 text-sm";
                statusDiv.innerText = "Please register an organization first.";
                return;
            }
            if (!file) {
                statusDiv.className = "text-red-600 mt-2 text-sm";
                statusDiv.innerText = "Please select a PDF file.";
                return;
            }

            const formData = new FormData();
            formData.append('organizationId', currentOrgId);
            formData.append('file', file);

            statusDiv.className = "text-blue-600 mt-2 text-sm";
            statusDiv.innerText = "Uploading and processing PDF text & chunks...";

            try {
                const res = await fetch('/api/documents/upload', {
                    method: 'POST',
                    body: formData
                });

                const resText = await res.text();
                if (!res.ok) {
                    throw new Error(resText || "Upload failed");
                }

                statusDiv.className = "text-green-600 mt-2 text-sm";
                statusDiv.innerText = `📄 ${resText}`;
                fileInput.value = '';

            } catch (err) {
                statusDiv.className = "text-red-600 mt-2 text-sm";
                statusDiv.innerText = err.message;
            }
        }

        // 3. SHOW LIVE URL & EMBED SNIPPET
        function displayAssistantUrls(token, orgName) {
            const chatUrl = `${window.location.origin}/chat.html?token=${token}`;
            const iframeSnippet = `<iframe src="${chatUrl}" width="400" height="600" frameborder="0"></iframe>`;

            document.getElementById('directChatUrl').value = chatUrl;
            document.getElementById('btnOpenChat').href = chatUrl;
            document.getElementById('embedIframeCode').value = iframeSnippet;
            document.getElementById('activeOrgBadge').innerText = `${orgName} (Active)`;

            document.getElementById('assistantSection').classList.remove('hidden');
        }

        function copyEmbed() {
            const textarea = document.getElementById('embedIframeCode');
            textarea.select();
            navigator.clipboard.writeText(textarea.value);
            alert("Embed code copied to clipboard!");
        }
    </script>
</body>
</html>
