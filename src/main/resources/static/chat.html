<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Knowledge Assistant</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .chat-container { width: 400px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .chat-box { height: 300px; border: 1px solid #ddd; border-radius: 4px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #fafafa; }
        .message { margin-bottom: 10px; font-size: 14px; }
        .user { text-align: right; color: #007bff; }
        .assistant { text-align: left; color: #333; }
        .source { font-size: 11px; color: #666; font-style: italic; }
        input[type="text"] { width: 75%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { width: 20%; padding: 8px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div class="chat-container">
    <h3>Organization Assistant</h3>
    <div class="chat-box" id="chatBox"></div>
    <input type="text" id="questionInput" placeholder="Ask a question..." />
    <button onclick="sendQuestion()">Send</button>
</div>

<script>
    // Extract token from URL parameter e.g., /chat.html?token=YOUR_UUID_TOKEN
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token') || 'DEFAULT_TOKEN';

    async function sendQuestion() {
        const input = document.getElementById('questionInput');
        const chatBox = document.getElementById('chatBox');
        const question = input.value.trim();
        if (!question) return;

        // Append user message
        chatBox.innerHTML += `<div class="message user"><b>You:</b> ${question}</div>`;
        input.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch(`/api/ask?token=${token}&question=${encodeURIComponent(question)}`, {
                method: 'POST'
            });
            const data = await response.json();

            let assistantReply = data.answer || "No response received.";
            let sourceRef = data.sourceReference ? `<div class="source">Source: ${data.sourceReference}</div>` : '';

            chatBox.innerHTML += `<div class="message assistant"><b>Assistant:</b> ${assistantReply} ${sourceRef}</div>`;
        } catch (err) {
            chatBox.innerHTML += `<div class="message assistant" style="color:red;"><b>Error:</b> Could not reach assistant.</div>`;
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
