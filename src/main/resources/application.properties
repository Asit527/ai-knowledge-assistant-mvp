spring.application.name=ai-knowledge-assistant

server.port=8080

# Database Configuration (Make sure your local MySQL is running)
spring.datasource.url=jdbc:mysql://localhost:3306/ai_assistant_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root123

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Mandatory limit: Max 10MB per PDF file
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
